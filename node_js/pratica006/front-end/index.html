<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prática 006 - Home</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 60px;    /* Espaço para não cobrir o conteúdo com a navbar topo */
      padding-bottom: 80px; /* Espaço para não cobrir o conteúdo com a navbar flutuante */
    }

    /* Navbar do Topo */
    .top-navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 1000;
    }

    .brand-logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    .top-template-actions {
      display: flex;
      gap: 1rem;
    }

    .template-badge {
      background-color: #334155;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
    }

    /* Áreas de Conteúdo Principal (Home) */
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .empty-state {
      text-align: center;
      max-width: 400px;
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 0.5rem;
    }

    .empty-subtitle {
      font-size: 0.95rem;
      color: #64748b;
    }

    /* Navbar Flutuante na Parte Inferior */
    .floating-navbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid #334155;
      border-radius: 9999px;
      padding: 0.4rem 0.6rem;
      display: flex;
      gap: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .nav-tab {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0.6rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-tab.active {
      background-color: #0284c7;
      color: #ffffff;
    }

    .nav-tab:hover:not(.active) {
      color: #f1f5f9;
      background-color: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- Navbar Fixa do Topo -->
  <header class="top-navbar">
    <div class="brand-logo">Prática 006</div>
    <div class="top-template-actions">
      <span class="template-badge">Template</span>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="main-container">
    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <h1 class="empty-title">Sem postagens</h1>
      <p class="empty-subtitle">Não há conteúdos ou notícias disponíveis no momento.</p>
    </div>
  </main>

  <!-- Navbar Flutuante Inferior -->
  <nav class="floating-navbar">
    <button class="nav-tab active" type="button">Feed</button>
    <button class="nav-tab" type="button">Notícias</button>
  </nav>

</body>
</html>
