<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prática 006 - Feed</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Container onde a Navbar Superior será injetada -->
  <div id="navbar-top-container"></div>

  <!-- Conteúdo Principal: FEED -->
  <main class="main-container">
    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <h1 class="empty-title">Nenhuma postagem ainda</h1>
      <p class="empty-subtitle">Fique atento! Novas atualizações e publicações aparecerão aqui em breve.</p>
    </div>
  </main>

  <!-- Modal de Autenticação -->
  <div class="modal-overlay" id="authModal">
    <div class="auth-card">
      <div class="auth-header">
        <h3 id="modalTitle">Entrar na Conta</h3>
        <button class="close-modal" id="closeAuthBtn" type="button">&times;</button>
      </div>
      <form class="auth-form" id="authForm">
        <div class="form-group">
          <label for="emailInput">E-mail</label>
          <input type="email" id="emailInput" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="passwordInput">Senha</label>
          <input type="password" id="passwordInput" placeholder="••••••••" required>
        </div>
        <button class="btn-submit" id="submitBtn" type="submit">Entrar</button>
      </form>
      <div class="auth-toggle-text" id="toggleAuthMode">
        Não tem conta? <span>Cadastre-se</span>
      </div>
    </div>
  </div>

  <!-- Container onde a Navbar Flutuante será injetada -->
  <div id="navbar-bottom-container"></div>

  <!-- Scripts ES Modules -->
  <script type="module" src="./js/main.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
